%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case: Schaefer-Turek 2D-1 steady incompressible laminar flow past cylinder   %
% Re = 20, Um = 0.2 m/s, D = 0.1 m, H = 0.41 m                                %
% Compatible with SU2 v8.x                                                     %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% -------------------- PROBLEM DEFINITION ------------------------------------ %
SOLVER= INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION ------------------ %
% Benchmark fluid properties:

INC_DENSITY_INIT= 1000.0
INC_VELOCITY_INIT= ( 0.2, 0.0, 0.0 )

% --------------------------- VISCOSITY MODEL -------------------------------- %
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1

% ---------------------- REFERENCE VALUE DEFINITION -------------------------- %
% For 2D cylinder benchmark:
% reference length = D = 0.1
% reference area   = D * 1 = 0.1 (unit depth in 2D)
% moment origin not critical here, but set consistently
REF_ORIGIN_MOMENT_X= 0.20
REF_ORIGIN_MOMENT_Y= 0.20
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 0.1
REF_AREA= 0.1

% -------------------- BOUNDARY CONDITION DEFINITION ------------------------- %
% No-slip walls: top, bottom, and cylinder
MARKER_HEATFLUX= ( wall, 0.0, cylinder, 0.0 )

% Inlet
% Use prescribed inlet profile from benchmark:
% U(y) = 4*Um*y*(H-y)/H^2, with Um = 0.2, H = 0.41
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= ( inlet, 0.0, 0.2, 1.0, 0.0, 0.0 )

SPECIFIED_INLET_PROFILE= YES
INLET_FILENAME= inlet.dat
INLET_MATCHING_TOLERANCE=1E-3

% Outlet
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= ( outlet, 0.0 )

% Markers for monitoring and output
MARKER_PLOTTING= ( cylinder )
MARKER_MONITORING= ( cylinder )

% ---------------- NUMERICAL METHOD COMMON PARAMETERS ------------------------ %
NUM_METHOD_GRAD= GREEN_GAUSS


CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.95, 1.05, 10, 2000.0 )
RK_ALPHA_COEFF= ( 0.66667, 0.66667, 1.000000 )
ITER= 10000
VENKAT_LIMITER_COEFF= 0.05

% -------------------- FLOW NUMERICAL METHOD DEFINITION ---------------------- %
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
JST_SENSOR_COEFF= ( 0.5, 0.02 )
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS ------------------------- %
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-10

% ------------------------- INPUT/OUTPUT INFORMATION ------------------------- %
MESH_FILENAME= cylinder_re20_BL.su2
MESH_FORMAT= SU2

SOLUTION_FILENAME= solution_flow.dat
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow

OUTPUT_WRT_FREQ= 100
OUTPUT_FILES= ( RESTART, RESTART_ASCII, PARAVIEW_ASCII, SURFACE_PARAVIEW_ASCII )

SCREEN_OUTPUT= ( INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, DRAG, LIFT )
HISTORY_OUTPUT= ( ITER, RMS_RES, CFL_NUMBER, DRAG, LIFT )